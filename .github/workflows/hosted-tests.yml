name: Hosted app tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_HOSTED_MODE: '1'
          VITE_BASE_PATH: /plugins/filament-swatch/
      - run: node --test scripts/hosted-mode.test.mjs scripts/hosted-query.test.mjs
